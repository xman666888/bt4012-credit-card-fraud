[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt4012-credit-card-fraud"
version = "0.1.0"
description = "Reproducible credit-card fraud analytics course project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
boosting = [
  "catboost>=1.2,<2",
  "lightgbm>=4.0,<5",
  "xgboost>=2.0,<4",
]
dev = [
  "jupyterlab>=4.0,<5",
  "kaggle>=1.7,<2",
  "matplotlib>=3.8,<4",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "seaborn>=0.13,<1",
]

[project.scripts]
bt4012-baseline = "bt4012_fraud.baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
