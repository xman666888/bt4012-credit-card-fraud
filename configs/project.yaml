project:
  course: BT4012 Fraud Analytics
  academic_year: 2026/2027 Semester 1
  group: 17
  random_seed: 4012
  internal_checkpoint: 2026-10-17
  next_team_meeting: 2026-10-17T21:00:00+08:00

datasets:
  sparkov:
    role: primary
    train_path: data/raw/fraudTrain.csv
    test_path: data/raw/fraudTest.csv
    target: is_fraud
    timestamp: trans_date_trans_time
    entity_id: cc_num            # grouping only; dropped before fitting
    validation_fraction: 0.20
    split_strategy: chronological
  ieee_cis:
    role: real_data_replication
    transaction_path: data/raw/train_transaction.csv
    identity_path: data/raw/train_identity.csv
    join_key: TransactionID      # left join; ~24.4% have identity records
    target: isFraud
    timestamp: TransactionDT     # elapsed seconds, not a calendar date
    entity_id: pending_card_reconstruction
    official_test_used: false    # competition test files have no labels
    split_strategy: chronological
    split_fractions: pending_team_decision   # train / validation / held-out test

evaluation:
  primary_metric: pr_auc
  secondary_metrics:
    - recall
    - precision
    - f1
    - roc_auc
  default_threshold: 0.50
  label_delay_days: 7
  hide_all_labels_in_delay_window: true
  precision_at_k_unit: pending_team_decision

analysis:
  concept_drift:
    distribution_metrics:
      - ks
      - psi
    require_performance_by_time_window: true
  card_history_ablation:
    compare_with_and_without_history: true
    reconstructed_card_id_required: true   # IEEE-CIS only; Sparkov uses cc_num
  card_history_label_propagation_check: true   # IEEE-CIS
  replicate_full_pipeline_on_each_dataset: true

models:
  reference: dummy_prior
  m0_families:
    - logistic_regression
    - random_forest
    - catboost
  m1: class_weights
  m2: sliding_window_retraining
  m3: pending_team_decision     # named semi-supervised algorithm
  m4: pending_team_decision     # anomaly score as feature vs combined with output
